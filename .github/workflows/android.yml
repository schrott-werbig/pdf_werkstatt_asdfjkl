name: Android-App bauen

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Web-App in die Android-App kopieren
        run: |
          mkdir -p android/app/src/main/assets/www
          cp pdf-werkstatt.html android/app/src/main/assets/www/
          if [ -d ocr ]; then cp -r ocr android/app/src/main/assets/www/; fi

      - name: Signaturschlüssel bereitstellen (optional)
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then echo "$KEYSTORE_BASE64" | base64 -d > android/app/release.jks; fi

      - name: APK bauen
        working-directory: android
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          VERSION_CODE: ${{ github.run_number }}
          VERSION_NAME: 1.${{ github.run_number }}
        run: gradle --no-daemon assembleRelease

      - name: Prüfen, dass die App keine Internet-Berechtigung hat
        run: |
          AAPT=$(ls $ANDROID_HOME/build-tools/*/aapt2 | tail -1)
          $AAPT dump permissions android/app/build/outputs/apk/release/app-release.apk | tee perms.txt
          if grep -q "android.permission.INTERNET" perms.txt; then echo "FEHLER: INTERNET-Berechtigung gefunden"; exit 1; fi

      - uses: actions/upload-artifact@v4
        with:
          name: pdf-werkstatt-apk
          path: android/app/build/outputs/apk/release/app-release.apk
