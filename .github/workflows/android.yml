name: Android-App bauen

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  apk:
    # fest auf 24.04 (ubuntu-latest wechselt ab Okt. 2026 auf 26)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android-SDK und Gradle bereitstellen
        run: |
          set -e
          # Android-SDK ist auf dem GitHub-Runner vorinstalliert
          export ANDROID_HOME="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "sdk.dir=$ANDROID_HOME" > android/local.properties
          ls "$ANDROID_HOME/platforms" "$ANDROID_HOME/build-tools" | tee sdk.txt
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0" > /dev/null || true
          # Gradle direkt von gradle.org
          wget -q https://services.gradle.org/distributions/gradle-8.11.1-bin.zip
          unzip -q gradle-8.11.1-bin.zip -d "$HOME"
          echo "$HOME/gradle-8.11.1/bin" >> "$GITHUB_PATH"

      - name: Web-App in die Android-App kopieren
        run: |
          mkdir -p android/app/src/main/assets/www
          cp pdf-werkstatt.html android/app/src/main/assets/www/
          if [ -d ocr ]; then cp -r ocr android/app/src/main/assets/www/; fi

      - name: Signaturschlüssel bereitstellen (optional)
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then echo "$KEYSTORE_BASE64" | base64 -d > android/app/release.jks; fi

      - name: APK bauen
        working-directory: android
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          VERSION_CODE: ${{ github.run_number }}
          VERSION_NAME: 1.${{ github.run_number }}
        run: |
          set -o pipefail
          gradle --no-daemon --stacktrace assembleRelease 2>&1 | tee ../build.log

      - name: Prüfen, dass die App keine Internet-Berechtigung hat
        run: |
          AAPT=$(ls $ANDROID_HOME/build-tools/*/aapt2 | tail -1)
          $AAPT dump permissions android/app/build/outputs/apk/release/app-release.apk | tee perms.txt
          if grep -q "android.permission.INTERNET" perms.txt; then echo "FEHLER: INTERNET-Berechtigung gefunden"; exit 1; fi

      - uses: actions/upload-artifact@v4
        with:
          name: pdf-werkstatt-apk
          path: android/app/build/outputs/apk/release/app-release.apk

      # Bei Fehlern: letzte Protokollzeilen als öffentliche Meldung auf der Lauf-Seite anzeigen
      - name: Fehlerbericht
        if: failure()
        run: |
          {
            echo "SDK:"; cat sdk.txt 2>/dev/null || true
            echo "--- Build-Protokoll (Ende) ---"
            grep -E "FAILURE|What went wrong|error:|e: |> |Could not|BUILD" build.log 2>/dev/null | head -40 || true
            tail -25 build.log 2>/dev/null || echo "(kein Build-Protokoll – Fehler vor dem Build)"
          } > report.txt
          MSG=$(sed -e 's/%/%25/g' report.txt | awk '{printf "%s%%0A", $0}')
          echo "::error title=Fehlerbericht::${MSG}"
